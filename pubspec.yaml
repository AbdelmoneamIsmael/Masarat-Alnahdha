name: masarat_alnahdha
description: "A new Flutter project."

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  animate_do: ^4.2.0
  cached_network_image: ^3.4.1
  card_swiper: ^3.0.1
  carousel_slider: ^5.1.1
  cupertino_icons: ^1.0.8
  delightful_toast: ^1.1.0
  device_preview: ^1.3.1
  easy_localization: ^3.0.7
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_bloc: ^9.1.1
  flutter_blurhash: ^0.9.1
  flutter_debouncer: ^2.0.0
  flutter_map: ^8.2.2
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^9.2.4
  flutter_spinkit: ^5.2.2
  flutter_staggered_animations: ^1.1.1
  flutter_staggered_grid_view: ^0.7.0
  flutter_svg: ^2.2.1
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  get_it: ^8.2.0
  go_router: ^16.2.4
  intl: any
  latlong2: ^0.9.1
  liquid_glass_renderer: ^0.1.1-dev.10
  loading_animation_widget: ^1.3.0
  location: ^8.0.1
  motion_toast: ^2.14.0
  photo_view: ^0.15.0
  pull_to_refresh_flutter3: ^2.0.2
  shared_preferences: ^2.5.3
  smooth_page_indicator: ^1.2.1
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: null
  flutter_gen_runner: null
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/ex_products_no_bg/
    - assets/exproducts/
    - assets/svgs/
    - assets/fonts/
    - assets/lottie/
    - assets/masarat_categories/
    - assets/masarat_subcat/
    - assets/masarat/التنمية/
    - assets/masarat/الصدور/
    - assets/masarat/الوطنية/
    - assets/masarat/خضراوات/
    - assets/masarat/دجاج دوكس/
    - assets/masarat/دجاج ساديا/
    - assets/masarat/دجاج فقيه/
    - assets/masarat/رضوى/
    - assets/masarat/زيوت/
    - assets/masarat/شاورما الدجاج/
    - assets/masarat/كبده/
    - assets/masarat/كواليكوا/
    - assets/masarat/لحوم/
    - assets/masarat/مفروم الدجاج/
    - assets/masarat/مقطعات دجاج/
    - assets/masarat/منتجات ورقية وبلاستيكية/
    - assets/masarat/مواد جافة وسائلة/
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Tajawal-Black.ttf
          weight: 800
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 900
        - asset: assets/fonts/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/Tajawal-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
